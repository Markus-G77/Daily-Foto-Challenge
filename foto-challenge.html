<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>FotoChallenge · Toskana 2026</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, 'Segoe UI', system-ui, sans-serif; background: #0f0f0f; color: #f0f0f0; min-height: 100vh; }
#app { max-width: 480px; margin: 0 auto; min-height: 100vh; }
.center { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; }
.spinner { width:36px; height:36px; border:3px solid #333; border-top:3px solid #e8b84b; border-radius:50%; animation:spin 0.8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.name-screen { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:32px; }
.logo-emoji { font-size:60px; display:block; text-align:center; }
.logo-title { font-size:32px; font-weight:700; color:#e8b84b; text-align:center; margin:10px 0 4px; }
.logo-sub { color:#888; font-size:16px; text-align:center; margin-bottom:48px; }
.name-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; width:100%; max-width:280px; }
.name-btn { padding:20px 0; background:#1a1a1a; border:1px solid #333; border-radius:12px; color:#f0f0f0; font-size:18px; cursor:pointer; }
.name-btn:active { background:#2a2a2a; border-color:#e8b84b; }
.header { display:flex; align-items:center; justify-content:space-between; padding:14px 16px; background:#161616; border-bottom:1px solid #222; position:sticky; top:0; z-index:10; }
.header-left { display:flex; align-items:center; gap:10px; }
.header-emoji { font-size:24px; }
.header-title { font-weight:700; font-size:16px; color:#e8b84b; }
.header-sub { font-size:12px; color:#888; }
.motto-tag { display:flex; flex-direction:column; align-items:flex-end; }
.motto-label { font-size:10px; color:#666; text-transform:uppercase; letter-spacing:1px; }
.motto-text { font-size:14px; font-weight:600; color:#e8b84b; }
.tabs { display:flex; background:#161616; border-bottom:1px solid #222; }
.tab { flex:1; padding:10px 4px; background:none; border:none; border-bottom:2px solid transparent; color:#666; font-size:11px; cursor:pointer; position:relative; }
.tab.active { color:#e8b84b; border-bottom-color:#e8b84b; }
.badge { position:absolute; top:4px; right:4px; background:#e8b84b; color:#000; border-radius:8px; font-size:9px; padding:1px 4px; font-weight:700; }
.content { padding:16px; }
h2.section-title { margin-bottom:8px; font-size:20px; font-weight:700; }
.hint { margin-bottom:16px; font-size:14px; color:#888; }
.divider { height:1px; background:#222; margin:24px 0; }
.upload-placeholder { border:2px dashed #333; border-radius:12px; padding:40px 20px; text-align:center; cursor:pointer; margin-bottom:16px; }
.my-photo { width:100%; border-radius:12px; margin-bottom:12px; object-fit:cover; max-height:320px; display:block; cursor:pointer; }
.primary-btn { width:100%; padding:14px; background:#e8b84b; border:none; border-radius:10px; color:#000; font-size:16px; font-weight:700; cursor:pointer; margin-bottom:4px; }
.primary-btn:disabled { opacity:0.5; }
.delete-btn { width:100%; padding:10px; background:none; border:1px solid #3a1a1a; border-radius:8px; color:#a44; font-size:13px; cursor:pointer; margin-top:8px; }
.thumb-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.thumb-item { display:flex; flex-direction:column; align-items:center; gap:4px; }
.thumb { width:100%; aspect-ratio:1; object-fit:cover; border-radius:8px; cursor:pointer; }
.thumb-empty { width:100%; aspect-ratio:1; background:#1a1a1a; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:20px; }
.thumb-name { font-size:11px; color:#888; }
.admin-box { background:#1a1a1a; border:1px solid #333; border-radius:12px; padding:16px; margin-top:24px; }
.danger-btn { width:100%; padding:12px; background:#2a1a00; border:1px solid #e8b84b; border-radius:8px; color:#e8b84b; font-size:14px; font-weight:600; cursor:pointer; }
.rate-card { background:#1a1a1a; border-radius:12px; margin-bottom:16px; overflow:hidden; }
.rate-photo { width:100%; max-height:280px; object-fit:cover; display:block; cursor:pointer; }
.rate-empty { padding:24px; text-align:center; color:#666; font-size:14px; }
.rate-row { display:flex; justify-content:space-between; align-items:center; padding:10px 14px 4px; }
.rate-name { font-weight:600; font-size:16px; }
.rate-score { font-size:22px; font-weight:700; color:#e8b84b; }
.slider-row { display:flex; align-items:center; gap:8px; padding:4px 14px 14px; }
.slider-row input[type=range] { flex:1; accent-color:#e8b84b; }
.slider-label { font-size:12px; color:#666; width:14px; text-align:center; }
.stand-row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #1f1f1f; font-size:15px; }
.stand-score { color:#e8b84b; font-weight:600; }
.winner-banner { background:#2a1f00; border:1px solid rgba(232,184,75,0.3); border-radius:10px; padding:12px 16px; margin-bottom:16px; font-size:15px; }
.rank-row { display:flex; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid #1f1f1f; }
.rank-row.first { background:#1a1500; border-radius:8px; padding:12px 8px; }
.rank-pos { width:28px; text-align:center; font-size:18px; }
.rank-name { width:64px; font-size:14px; font-weight:600; }
.rank-bar-wrap { flex:1; height:6px; background:#222; border-radius:3px; overflow:hidden; }
.rank-bar { height:100%; background:#e8b84b; border-radius:3px; }
.rank-score { font-size:16px; font-weight:700; color:#e8b84b; width:36px; text-align:right; }
.rank-votes { font-size:11px; color:#666; width:44px; text-align:right; }
.error-banner { background:#2a0000; border:1px solid #a00; border-radius:8px; padding:12px; margin-bottom:12px; font-size:13px; color:#f88; }
.lightbox { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:1000; align-items:center; justify-content:center; flex-direction:column; }
.lightbox.open { display:flex; }
.lightbox img { max-width:100vw; max-height:90vh; object-fit:contain; }
.lightbox-name { color:#e8b84b; font-size:14px; font-weight:600; margin-top:12px; }
.lightbox-close { position:absolute; top:16px; right:20px; font-size:32px; color:#fff; cursor:pointer; }
.switch-btn { display:block; margin:16px auto 0; padding:8px 20px; background:none; border:1px solid #2a2a2a; border-radius:8px; color:#555; font-size:12px; cursor:pointer; }
.refresh-btn { display:block; margin:16px auto 0; padding:8px 24px; background:none; border:1px solid #333; border-radius:8px; color:#888; cursor:pointer; font-size:14px; }
</style>
</head>
<body>
<div id="app"></div>
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <span class="lightbox-close">&times;</span>
  <img src="" alt="">
  <div class="lightbox-name"></div>
</div>
<script>
// ── Config ────────────────────────────────────────────────────────────────────
const PLAYERS = ["Markus","Marion","Levy","Chey"];
const MOTTOS = ["Familie","Natur","Makro","Tiere","Blüten","Architektur","Romantik","Wasser","Licht & Schatten","Portrait","Menschen","Essen & Trinken","Unterwegs","Himmel","Stimmung","Heimlich","Farben","Klein & Groß","Sonnenuntergang","Erinnerung","Ira"];
const JSONBIN = "https://api.jsonbin.io/v3/b";
const BIN_ID  = "6a6eff0ada38895dfeaefcda";
const API_KEY = "$2a$10$OwA9YnjvZJ939pKczIeI5OA/Dot6PYb5Nq97dcFwrS7XY13qnm58q";

// ── Storage ───────────────────────────────────────────────────────────────────
async function binGet() {
  try {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 8000);
    const r = await fetch(`${JSONBIN}/${BIN_ID}/latest`, {
      headers:{"X-Master-Key":API_KEY},
      signal: controller.signal
    });
    clearTimeout(timeout);
    if (!r.ok) return null;
    return (await r.json()).record;
  } catch { return null; }
}
async function binPut(data) {
  try {
    const r = await fetch(`${JSONBIN}/${BIN_ID}`, {
      method:"PUT",
      headers:{"Content-Type":"application/json","X-Master-Key":API_KEY},
      body: JSON.stringify(data)
    });
    return r.ok;
  } catch { return false; }
}

// ── Image compression ─────────────────────────────────────────────────────────
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = e => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const maxSide = 600;
        let {width, height} = img;
        if (Math.max(width, height) > 3000) {
          const mid = document.createElement("canvas");
          mid.width = Math.round(width * 0.4);
          mid.height = Math.round(height * 0.4);
          mid.getContext("2d").drawImage(img, 0, 0, mid.width, mid.height);
          width = mid.width; height = mid.height;
          const scale = Math.min(1, maxSide / Math.max(width, height));
          const c = document.createElement("canvas");
          c.width = Math.round(width*scale); c.height = Math.round(height*scale);
          c.getContext("2d").drawImage(mid, 0, 0, c.width, c.height);
          resolve(pickQ(c));
        } else {
          const scale = Math.min(1, maxSide / Math.max(width, height));
          const c = document.createElement("canvas");
          c.width = Math.round(width*scale); c.height = Math.round(height*scale);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          resolve(pickQ(c));
        }
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
function pickQ(canvas) {
  for (const q of [0.5,0.38,0.25,0.15,0.08,0.05]) {
    const r = canvas.toDataURL("image/jpeg", q);
    if (r.length < 60000) return r;
  }
  return canvas.toDataURL("image/jpeg", 0.05);
}

// ── State ─────────────────────────────────────────────────────────────────────
let state = {
  myName: localStorage.getItem("fc_me") || null,
  tab: "upload",
  shared: null,
  myRatings: {},
  uploading: false,
  saving: false,
  error: null,
  pollTimer: null,
};

function initShared() {
  return { appState: { currentDay:0, dayStarted:new Date().toISOString(), yesterdayWinner:null, ratings:{} }, photos:{today:{},yesterday:{}} };
}

// ── Load & Save ───────────────────────────────────────────────────────────────
async function loadAndRender() {
  const data = await binGet();
  if (!data) {
    state.error = "Verbindungsfehler — bitte neu laden";
    if (!state.shared) {
      document.getElementById("app").innerHTML = `
        <div class="center">
          <p style="color:#f88;padding:32px;text-align:center">Verbindungsfehler.<br><br>
          <button onclick="loadAndRender()" style="padding:12px 24px;background:#e8b84b;border:none;border-radius:8px;color:#000;font-size:16px;cursor:pointer">Nochmal versuchen</button></p>
        </div>`;
    }
    return;
  }

  // Migrate old photoBins format to new photos format
  if (data.photoBins && !data.photos) {
    const pb = data.photoBins;
    const players = ["Markus","Marion","Levy","Chey"];
    const [tRes, yRes] = await Promise.all([
      Promise.all(players.map(p => pb["t_"+p] ? fetchBin(pb["t_"+p]) : Promise.resolve(null))),
      Promise.all(players.map(p => pb["y_"+p] ? fetchBin(pb["y_"+p]) : Promise.resolve(null))),
    ]);
    const today = {}, yesterday = {};
    players.forEach((p,i) => {
      if (tRes[i]?.photo) today[p] = tRes[i].photo;
      if (yRes[i]?.photo) yesterday[p] = yRes[i].photo;
    });
    const newData = { appState: data.appState, photos: { today, yesterday } };
    await binPut(newData);
    state.shared = { appState: newData.appState, photos: newData.photos };
    const day = newData.appState.currentDay;
    if (state.myName) state.myRatings = newData.appState.ratings?.[day]?.[state.myName] || {};
    state.error = null;
    render();
    return;
  }

  const appState = data.appState || initShared().appState;
  const photos = data.photos || { today:{}, yesterday:{} };
  state.shared = { appState, photos };
  const day = appState.currentDay;
  if (state.myName) state.myRatings = appState.ratings?.[day]?.[state.myName] || {};
  state.error = null;
  render();
}

async function fetchBin(id) {
  try {
    const controller = new AbortController();
    setTimeout(() => controller.abort(), 6000);
    const r = await fetch(`${JSONBIN}/${id}/latest`, {
      headers:{"X-Master-Key":API_KEY}, signal: controller.signal
    });
    if (!r.ok) return null;
    return (await r.json()).record;
  } catch { return null; }
}

async function savePhoto(person, photoData) {
  for (let i = 0; i < 3; i++) {
    const data = await binGet();
    if (!data) { await sleep(500); continue; }
    const photos = data.photos || { today:{}, yesterday:{} };
    photos.today = { ...(photos.today||{}), [person]: photoData };
    const payload = { ...data, photos };
    if (await binPut(payload)) return true;
    await sleep(500 + Math.random()*500);
  }
  return false;
}

async function saveRatings(appState) {
  for (let i = 0; i < 3; i++) {
    const data = await binGet();
    if (!data) { await sleep(500); continue; }
    const payload = { ...data, appState };
    if (await binPut(payload)) return true;
    await sleep(500);
  }
  return false;
}

async function deletePhoto(person) {
  const data = await binGet();
  if (!data) return false;
  const photos = data.photos || { today:{}, yesterday:{} };
  delete photos.today[person];
  return binPut({ ...data, photos });
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function startPolling() {
  if (state.pollTimer) clearInterval(state.pollTimer);
  state.pollTimer = setInterval(loadAndRender, 20000);
}

// ── Actions ───────────────────────────────────────────────────────────────────
window.selectName = function(name) {
  state.myName = name;
  localStorage.setItem("fc_me", name);
  const day = state.shared?.appState?.currentDay || 0;
  state.myRatings = state.shared?.appState?.ratings?.[day]?.[name] || {};
  state.tab = "upload";
  startPolling();
  render();
};

window.logout = function() {
  localStorage.removeItem("fc_me");
  state.myName = null;
  state.myRatings = {};
  render();
};

window.switchTab = function(tab) { state.tab = tab; state.error = null; render(); };

window.handleUpload = async function(input) {
  const file = input.files[0];
  if (!file) return;
  state.uploading = true; state.error = null; render();
  try {
    const compressed = await compressImage(file);
    const ok = await savePhoto(state.myName, compressed);
    if (ok) {
      if (!state.shared.photos) state.shared.photos = { today:{}, yesterday:{} };
      state.shared.photos.today[state.myName] = compressed;
      state.tab = "rate";
    } else {
      state.error = "Upload fehlgeschlagen (" + Math.round(file.size/1024) + "KB)";
    }
  } catch(e) { state.error = "Fehler: " + e.message; }
  state.uploading = false;
  render();
};

window.previewRating = function(person, value) {
  state.myRatings = { ...state.myRatings, [person]: parseFloat(value) };
  const cards = document.querySelectorAll(".rate-card");
  const others = PLAYERS.filter(p => p !== state.myName);
  others.forEach((name, i) => {
    if (name === person && cards[i]) {
      const s = cards[i].querySelector(".rate-score");
      if (s) s.textContent = parseFloat(value).toFixed(1);
    }
  });
};

window.saveRating = async function(person, value) {
  if (!state.myName || person === state.myName) return;
  state.myRatings = { ...state.myRatings, [person]: value };
  state.saving = true;
  const day = state.shared.appState.currentDay;
  const newRatings = {
    ...state.shared.appState.ratings,
    [day]: {
      ...(state.shared.appState.ratings?.[day]||{}),
      [state.myName]: { ...(state.shared.appState.ratings?.[day]?.[state.myName]||{}), [person]: value }
    }
  };
  const newAppState = { ...state.shared.appState, ratings: newRatings };
  const ok = await saveRatings(newAppState);
  if (ok) { state.shared.appState = newAppState; state.error = null; }
  else { state.error = "Speichern fehlgeschlagen"; }
  state.saving = false;
  render();
};

window.deleteMyPhoto = async function() {
  if (!state.myName) return;
  const ok = await deletePhoto(state.myName);
  if (ok && state.shared?.photos?.today) delete state.shared.photos.today[state.myName];
  render();
};

window.advanceDay = async function() {
  if (!state.shared) return;
  const { appState, photos } = state.shared;
  const newDay = appState.currentDay + 1;
  if (newDay > 20) return;
  const dayRatings = appState.ratings?.[appState.currentDay] || {};
  const scores = {};
  PLAYERS.forEach(p => { scores[p] = []; });
  Object.entries(dayRatings).forEach(([rater, rated]) => {
    Object.entries(rated).forEach(([ratee, score]) => {
      if (rater !== ratee) scores[ratee].push(score);
    });
  });
  const winner = Object.entries(scores)
    .map(([p,s]) => ({ name:p, avg: s.length ? s.reduce((a,b)=>a+b,0)/s.length : 0 }))
    .sort((a,b) => b.avg-a.avg)[0]?.name || null;
  const newAppState = { ...appState, currentDay:newDay, dayStarted:new Date().toISOString(), yesterdayWinner:winner };
  const newPhotos = { today:{}, yesterday: photos.today||{} };
  const data = await binGet();
  const ok = await binPut({ ...data, appState:newAppState, photos:newPhotos });
  if (ok) {
    state.shared = { ...state.shared, appState:newAppState, photos:newPhotos };
    state.myRatings = {}; state.tab = "upload";
  } else { state.error = "Fehler beim Tageswechsel"; }
  render();
};

window.openLightbox = function(src, name) {
  const lb = document.getElementById("lightbox");
  lb.querySelector("img").src = src;
  lb.querySelector(".lightbox-name").textContent = name;
  lb.classList.add("open");
};
window.closeLightbox = function() { document.getElementById("lightbox").classList.remove("open"); };
window.loadAndRender = loadAndRender;

// ── Helpers ───────────────────────────────────────────────────────────────────
function computeRanking(appState) {
  const totals = {}, counts = {};
  PLAYERS.forEach(p => { totals[p]=0; counts[p]=0; });
  Object.values(appState.ratings||{}).forEach(dr => {
    Object.entries(dr).forEach(([rater,rated]) => {
      Object.entries(rated).forEach(([ratee,score]) => {
        if (rater!==ratee) { totals[ratee]+=score; counts[ratee]++; }
      });
    });
  });
  return PLAYERS.map(p => ({ name:p, avg:counts[p]?totals[p]/counts[p]:0, votes:counts[p] })).sort((a,b)=>b.avg-a.avg);
}
function getTodayScores(appState, day) {
  const dr = appState.ratings?.[day] || {};
  const scores = {};
  PLAYERS.forEach(p => { scores[p]=[]; });
  Object.entries(dr).forEach(([rater,rated]) => {
    Object.entries(rated).forEach(([ratee,score]) => {
      if (rater!==ratee) scores[ratee].push(score);
    });
  });
  return Object.fromEntries(Object.entries(scores).map(([p,s]) => [p, s.length?(s.reduce((a,b)=>a+b,0)/s.length).toFixed(1):null]));
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  const app = document.getElementById("app");
  if (!state.shared) {
    app.innerHTML = '<div class="center"><div class="spinner"></div><p style="color:#888;margin-top:16px">Lade…</p></div>';
    return;
  }
  if (!state.myName) { renderNameScreen(app); return; }
  renderApp(app);
}

function renderNameScreen(app) {
  app.innerHTML = `
    <div class="name-screen">
      <span class="logo-emoji">📷</span>
      <div class="logo-title">FotoChallenge</div>
      <div class="logo-sub">Toskana 2026</div>
      <p style="color:#ccc;margin-bottom:20px;font-size:18px">Wer bist du?</p>
      <div class="name-grid">
        ${PLAYERS.map(p => `<button class="name-btn" onclick="selectName('${p}')">${p}</button>`).join("")}
      </div>
    </div>`;
}

function renderApp(app) {
  const { appState, photos } = state.shared;
  const day = appState.currentDay;
  const motto = MOTTOS[day % MOTTOS.length];
  const todayPhotos = photos?.today || {};
  const yesterdayPhotos = photos?.yesterday || {};
  const myPhoto = todayPhotos[state.myName];
  const others = PLAYERS.filter(p => p !== state.myName);
  const ratedCount = others.filter(p => state.myRatings[p] !== undefined).length;
  const ranking = computeRanking(appState);
  const todayScores = getTodayScores(appState, day);
  const { tab } = state;

  let content = "";

  if (tab === "upload") {
    const allUploaded = PLAYERS.every(p => todayPhotos[p]);
    content = `
      <h2 class="section-title">Dein Foto heute</h2>
      <p class="hint">Thema: <strong>${motto}</strong></p>
      ${state.error ? `<div class="error-banner">${state.error}</div>` : ""}
      ${myPhoto
        ? `<img class="my-photo" src="${myPhoto}" alt="Mein Foto" onclick="openLightbox(this.src,'Mein Foto')"><p class="hint">✓ Hochgeladen</p>`
        : `<div class="upload-placeholder" onclick="document.getElementById('file-input').click()"><span style="font-size:48px">📷</span><p style="color:#888;margin-top:8px">Foto auswählen</p></div>`}
      <input type="file" id="file-input" accept="image/*" style="display:none" onchange="handleUpload(this)">
      <button class="primary-btn" onclick="document.getElementById('file-input').click()" ${state.uploading?"disabled":""}>
        ${state.uploading ? "Wird hochgeladen…" : myPhoto ? "Foto ersetzen" : "Foto hochladen"}
      </button>
      ${myPhoto ? `<button class="delete-btn" onclick="deleteMyPhoto()">🗑 Mein Foto löschen</button>` : ""}
      <div class="divider"></div>
      <h3 style="margin-bottom:12px;font-size:15px;font-weight:600;color:#ccc">Wer hat heute hochgeladen:</h3>
      <div class="thumb-grid">
        ${PLAYERS.map(p => `
          <div class="thumb-item">
            ${todayPhotos[p]
              ? `<img class="thumb" src="${todayPhotos[p]}" alt="${p}" onclick="openLightbox(this.src,'${p}')">`
              : `<div class="thumb-empty">⏳</div>`}
            <span class="thumb-name">${p}</span>
          </div>`).join("")}
      </div>
      ${allUploaded && state.myName === "Markus" ? `
        <div class="admin-box">
          <p style="font-size:13px;color:#888;margin-bottom:8px">Alle haben ihr Foto — nächsten Tag starten?</p>
          <button class="danger-btn" onclick="advanceDay()">→ Tag ${day+2} starten</button>
        </div>` : ""}`;
  }

  if (tab === "rate") {
    content = `
      <h2 class="section-title">Fotos bewerten</h2>
      <p class="hint">Thema: <strong>${motto}</strong></p>
      ${state.error ? `<div class="error-banner">${state.error}</div>` : ""}
      ${others.map(person => {
        const photo = todayPhotos[person];
        const cur = state.myRatings[person] ?? 5.0;
        return `<div class="rate-card">
          ${photo ? `<img class="rate-photo" src="${photo}" alt="${person}" onclick="openLightbox(this.src,'${person}')">` : `<div class="rate-empty">⏳ ${person} hat noch nicht hochgeladen</div>`}
          <div class="rate-row">
            <span class="rate-name">${person}</span>
            <span class="rate-score">${state.myRatings[person]!==undefined ? state.myRatings[person].toFixed(1) : "–"}</span>
          </div>
          ${photo ? `<div class="slider-row">
            <span class="slider-label">0</span>
            <input type="range" min="0" max="10" step="0.5" value="${cur}"
              oninput="previewRating('${person}',this.value)"
              onchange="saveRating('${person}',parseFloat(this.value))">
            <span class="slider-label">10</span>
          </div>` : ""}
        </div>`;
      }).join("")}
      ${state.saving ? `<p style="text-align:center;color:#888;font-size:12px">Speichern…</p>` : ""}
      <div class="divider"></div>
      <h3 style="margin-bottom:12px;font-size:15px;font-weight:600;color:#ccc">Aktueller Stand heute</h3>
      ${PLAYERS.map(p => `<div class="stand-row"><span>${p}</span><span class="stand-score">${todayScores[p] ? `⭐ ${todayScores[p]}` : "–"}</span></div>`).join("")}`;
  }

  if (tab === "yesterday") {
    const prevMotto = day > 0 ? MOTTOS[(day-1) % MOTTOS.length] : null;
    content = `
      <h2 class="section-title">${day===0 ? "Noch kein Vortag" : `Tag ${day} · ${prevMotto}`}</h2>
      ${appState.yesterdayWinner ? `<div class="winner-banner">🏆 <strong>${appState.yesterdayWinner}</strong> hat gestern gewonnen!</div>` : ""}
      ${day===0 ? `<p class="hint">Erster Tag — noch keine Vortagsfotos.</p>` :
        PLAYERS.map(p => {
          const photo = yesterdayPhotos[p];
          const dr = appState.ratings?.[day-1] || {};
          const vals = Object.entries(dr).filter(([r])=>r!==p).map(([,rated])=>rated[p]).filter(v=>v!==undefined);
          const avg = vals.length ? (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1) : null;
          return `<div class="rate-card">
            ${photo ? `<img class="rate-photo" src="${photo}" alt="${p}" onclick="openLightbox(this.src,'${p}')">` : `<div class="rate-empty">Kein Foto</div>`}
            <div class="rate-row"><span class="rate-name">${p}</span><span class="rate-score">${avg ? `⭐ ${avg}` : "–"}</span></div>
          </div>`;
        }).join("")}`;
  }

  if (tab === "ranking") {
    content = `
      <h2 class="section-title">Gesamtranking</h2>
      <p class="hint">Tag ${day+1} von 20</p>
      ${ranking.map((e,i) => `
        <div class="rank-row ${i===0?"first":""}">
          <span class="rank-pos">${["🥇","🥈","🥉"][i]||(i+1)+"."}</span>
          <span class="rank-name">${e.name}</span>
          <div class="rank-bar-wrap"><div class="rank-bar" style="width:${(e.avg/10)*100}%"></div></div>
          <span class="rank-score">${e.avg.toFixed(2)}</span>
          <span class="rank-votes">(${e.votes}⭐)</span>
        </div>`).join("")}
      ${day>=19 ? `<div style="background:#1a2a00;border:1px solid #6a0;border-radius:12px;padding:20px;text-align:center;font-size:18px;margin-top:16px">🎉 Gesamtsieger: <strong>${ranking[0]?.name}</strong>!</div>` : ""}
      <button class="refresh-btn" onclick="loadAndRender()">↻ Aktualisieren</button>`;
  }

  const tabs = [
    { key:"upload", label:"📤 Foto", badge: myPhoto?"✓":null },
    { key:"rate",   label:"⭐ Werten", badge: ratedCount>0?`${ratedCount}/3`:null },
    { key:"yesterday", label:"🏆 Gestern" },
    { key:"ranking",   label:"📊 Gesamt" },
  ];

  app.innerHTML = `
    <div class="header">
      <div class="header-left">
        <span class="header-emoji">📷</span>
        <div>
          <div class="header-title">FotoChallenge</div>
          <div class="header-sub">Tag ${day+1} · ${state.myName}</div>
        </div>
      </div>
      <div class="motto-tag">
        <span class="motto-label">Motto</span>
        <span class="motto-text">${motto}</span>
      </div>
    </div>
    <div class="tabs">
      ${tabs.map(t => `<button class="tab ${tab===t.key?"active":""}" onclick="switchTab('${t.key}')">
        ${t.label}${t.badge?`<span class="badge">${t.badge}</span>`:""}
      </button>`).join("")}
    </div>
    <div class="content">${content}</div>
    <button class="switch-btn" onclick="logout()">↩ Wechseln</button>`;
}

// ── Boot ──────────────────────────────────────────────────────────────────────
loadAndRender().then(() => {
  startPolling();
});
</script>
</body>
</html>
